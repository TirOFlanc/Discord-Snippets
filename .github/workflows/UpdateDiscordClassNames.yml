name: UpdateDiscordClassNames

on:
  schedule:
    - cron: '12 3 * * *'                  # Every day at 3:12 (UTC)
  workflow_dispatch:                      # Manual run from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      # Replaces outdated classes and opens a pull request only when something really changed
      - name: Check for Discord class name updates
        uses: TirOFlanc/Discord-Class-Updater@main
        with:
          language: fr
          files: "*.css"
          ignores: "BetterCssEditor.css,NiftyFontPlay.css,RefreshTitleBar.css"
          ignore-class-names: |
            visual-refresh
            user-profile-sidebar
            user-profile-popout
            user-profile-modal
            BetterDiscord
            Powercord
            Replugged
            Aliucord
            Vencord
            bd-
            rp-
            ac-
            vc-
          branch: updates
